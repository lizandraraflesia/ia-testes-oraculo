name: Reproduzir experimentos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduzir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install pytest pytest-cov
      - name: Experimento 1 (bug de fronteira)
        working-directory: experimento-1
        run: python analyze.py .
      - name: Experimento 2 (requisito com lacunas)
        working-directory: experimento-2
        run: python analyze.py .
      - name: Conferir se os resultados batem com os publicados
        run: git diff --exit-code -- experimento-1/results.json experimento-2/results.json
